    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --accent: #ff004f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Matches the main portfolio background */
            background: #080808;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-primary);
        }

        /* App-like Container */
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 90vh;
            max-height: 800px;
            background: radial-gradient(circle at top, rgba(255, 255, 255, 0.05) 0%, transparent 60%);
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px var(--glass-border);
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .app-container:hover {
            transform: translateY(-5px);
        }

        /* Responsive adjustments for mobile */
        @media (max-width: 450px) {
            .app-container {
                max-width: 95%;
                height: 85vh;
                border-radius: 30px;
            }

            .content {
                padding: 20px 15px;
            }

            .name {
                font-size: 24px;
            }

            .subtitle {
                margin-bottom: 25px;
            }

            .avatar-ring {
                width: 100px;
                height: 100px;
                margin-bottom: 15px;
            }
        }

        /* Top Status Bar Mockup */
        .status-bar {
            height: 44px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            z-index: 10;
        }

        /* Content Area */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* Animated Objects Section */

        .floating-obj {
            position: absolute;
            width: 80px;
            height: 80px;
            filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.5));
            z-index: 1;
            will-change: transform;
        }

        .floating-obj svg {
            width: 100%;
            height: 100%;
            fill: rgba(255, 255, 255, 0.9);
        }

        /* Airplane */
        .airplane-container {
            top: 15%;
            left: -100px;
            animation: flyPathRight 12s ease-in-out infinite;
        }

        .airplane-container svg {
            transform: rotate(45deg);
        }

        /* Laptop */
        .laptop-container {
            top: 40%;
            right: -100px;
            animation: flyPathLeft 15s ease-in-out infinite;
            animation-delay: 2s;
            width: 60px;
            height: 60px;
        }

        /* Mobile Phone */
        .phone-container {
            top: 60%;
            left: -100px;
            animation: flyPathRight 14s ease-in-out infinite;
            animation-delay: 5s;
            width: 50px;
            height: 50px;
        }

        /* Settings Gear */
        .gear-container {
            top: 75%;
            right: -100px;
            animation: flyPathLeft 18s linear infinite;
            animation-delay: 8s;
            width: 45px;
            height: 45px;
        }

        .gear-container svg {
            animation: spin 6s linear infinite;
        }

        @keyframes flyPathRight {
            0% {
                transform: translate(0, 50px) rotate(0deg) scale(0.8);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            50% {
                transform: translate(250px, -50px) rotate(15deg) scale(1.1);
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translate(500px, -150px) rotate(30deg) scale(0.8);
                opacity: 0;
            }
        }

        @keyframes flyPathLeft {
            0% {
                transform: translate(0, 0px) rotate(-10deg) scale(0.8);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            50% {
                transform: translate(-250px, 30px) rotate(-25deg) scale(1.1);
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translate(-500px, 100px) rotate(-40deg) scale(0.8);
                opacity: 0;
            }
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        /* Profile Elements */
        .avatar-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0));
            padding: 3px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            animation: pulse 3s infinite ease-in-out;
            z-index: 5;
            position: relative;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 0, 79, 0.4);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(255, 0, 79, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 0, 79, 0);
            }
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #2a2a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: 800;
            color: var(--text-primary);
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .greeting {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .name {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff, #a0a0a0);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--accent);
            margin-bottom: 40px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Action Button */
        .btn-enter {
            margin-top: auto;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 80%;
            padding: 16px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            z-index: 10;
        }

        .btn-enter:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn-enter:active {
            transform: translateY(1px);
        }

        .btn-enter::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-enter:hover::before {
            left: 100%;
        }

        /* Floating particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>

<body>

    <script>
        // Set dynamic time on status bar
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('time').innerText = hours + ':' + minutes;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Add interactive ripple effect on button
        function addRipple(e) {
            const btn = e.currentTarget;
            const circle = document.createElement('span');
            const diameter = Math.max(btn.clientWidth, btn.clientHeight);
            const radius = diameter / 2;

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - btn.getBoundingClientRect().left - radius}px`;
            circle.style.top = `${e.clientY - btn.getBoundingClientRect().top - radius}px`;
            circle.style.position = 'absolute';
            circle.style.borderRadius = '50%';
            circle.style.backgroundColor = 'rgba(255, 255, 255, 0.4)';
            circle.style.transform = 'scale(0)';
            circle.style.animation = 'ripple 0.6s linear';
            circle.style.pointerEvents = 'none';

            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes ripple {
                    to {
                        transform: scale(4);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);

            const existingRipple = btn.querySelector('.ripple-effect');
            if (existingRipple) {
                existingRipple.remove();
            }

            circle.classList.add('ripple-effect');
            btn.appendChild(circle);
        }

        // Add Floating Background Particles
        const app = document.getElementById('app');
        for (let i = 0; i < 8; i++) {
            const size = Math.random() * 60 + 20;
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';

            // Animation
            const duration = Math.random() * 10 + 10;
            p.style.animation = `float ${duration}s ease-in-out infinite`;
            p.style.animationDelay = (Math.random() * 5) + 's';
            app.appendChild(p);
        }

        // Particle animation keyframes
        const pStyle = document.createElement('style');
        pStyle.innerHTML = `
            @keyframes float {
                0% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
                50% { transform: translateY(-30px) rotate(10deg); opacity: 0.3; }
                100% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
            }
        `;
        document.head.appendChild(pStyle);
    </script>
